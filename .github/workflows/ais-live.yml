name: AIS Live Worker

# Free always-on worker using GitHub Actions (unlimited minutes on public
# repos). Each job stays connected to AISStream for ~5h40m, flushing vessel
# positions to Supabase every 5 s, then dispatches the next job so there is
# no gap. `concurrency` keeps exactly one job running and at most one
# queued, so the 30-minute cron below acts as a watchdog: if a self-dispatch
# ever fails, the next cron tick restarts the chain.
#
# Trade-offs: a few seconds of downtime at each hand-over; GitHub disables
# cron on repos with no commits for 60 days (self-dispatch keeps it alive,
# but push something occasionally); and GitHub's terms frown on Actions used
# as general compute — if this ever gets flagged, move to the Oracle Cloud
# Always Free VM described in worker/deploy/oracle-free-vm.md.

# PAUSED (21 Oct 2026): AISStream has been rejecting/dropping connections for
# months (aisstream/issues #15, #272, #291), so running this chain only burns
# minutes. Re-enable the schedule + push triggers below once a working AIS
# feed is wired in (see worker/README.md → "AIS feed status").
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "*/30 * * * *"
  # push:
  #   branches: [main]
  #   paths:
  #     - "worker/**"
  #     - ".github/workflows/ais-live.yml"

concurrency:
  group: ais-live
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - working-directory: worker
        run: npm ci
      - name: Run worker (~5h40m)
        working-directory: worker
        run: npm start
        env:
          SHIPFINDER_API_KEY: ${{ secrets.SHIPFINDER_API_KEY }}
          SHIPFINDER_MODE: ${{ vars.SHIPFINDER_MODE || 'fleet' }}
          SHIPFINDER_POLL_MS: ${{ vars.SHIPFINDER_POLL_MS || '300000' }}
          SHIPFINDER_STS_SYNC_MS: ${{ vars.SHIPFINDER_STS_SYNC_MS || '21600000' }}
          SHIPFINDER_STS_ZONES: ${{ vars.SHIPFINDER_STS_ZONES || '2,1,3' }}
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MAX_RUNTIME_MS: "20400000"
      - name: Dispatch next job
        if: ${{ always() && vars.AIS_LIVE_CHAIN == 'on' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ais-live.yml --ref main
